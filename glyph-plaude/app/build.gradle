plugins { id 'com.android.application' }

android {
    namespace 'com.plaude.glyph'
    compileSdk 35
    defaultConfig {
        applicationId 'com.plaude.glyph'
        minSdk 34
        targetSdk 35
        // En CI, el número de corrida; así cada release es una versión más nueva.
        def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
        versionCode run
        versionName "1.${run}"
    }
    signingConfigs {
        // Clave fija para que cada APK nuevo se instale encima del anterior.
        // Está en el repo a propósito: es una app personal sin datos sensibles.
        plaude {
            storeFile file('../signing/plaude-glyph.jks')
            storePassword 'plaude-glyph'
            keyAlias 'plaude'
            keyPassword 'plaude-glyph'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.plaude
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.all {
            testLogging {
                events 'failed'
                exceptionFormat 'full'
            }
        }
    }
}

dependencies {
    // SDK unificado de Nothing: https://github.com/Nothing-Developer-Programme/Glyph-Developer-Kit (sdk/).
    // No se versiona acá; CI lo baja en cada build. Para compilar a mano, ponelo en app/libs/.
    implementation fileTree(dir: 'libs', include: ['*.aar'])
    // Glyph Events: push con FCM. Sin google-services.json: la config la da el backend al vincular.
    implementation 'com.google.firebase:firebase-messaging:24.1.0'

    testImplementation 'junit:junit:4.13.2'
    // org.json real para los tests (el de android.jar es solo una cáscara).
    testImplementation 'org.json:json:20240303'
}
