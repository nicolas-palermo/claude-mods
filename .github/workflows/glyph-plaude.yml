name: glyph-plaude APK

on:
  push:
    paths:
      - 'glyph-plaude/**'
      - '.github/workflows/glyph-plaude.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glyph-plaude
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Solo se publica un APK nuevo si cambió la app. Si solo cambió glyph.json,
      # igual se corren los tests (que validan glyph.json) pero no hay release.
      - name: Decide whether to release
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qE '^(glyph-plaude/(app/|signing/|[^/]+\.gradle|gradle\.properties)|\.github/workflows/glyph-plaude\.yml)'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download Glyph SDK
        run: |
          # SDK unificado (Glyph + GlyphMatrix), más nuevo que el de GlyphMatrix-Developer-Kit.
          curl -fsSL -o app/libs/glyph-matrix-sdk.aar \
            "https://raw.githubusercontent.com/Nothing-Developer-Programme/Glyph-Developer-Kit/HEAD/sdk/glyph-matrix-sdk-2.0.aar"
          ls -la app/libs

      - name: Unit tests
        run: gradle :app:testReleaseUnitTest --stacktrace

      - name: Build APK
        if: steps.changes.outputs.release == 'true'
        run: gradle :app:assembleRelease --stacktrace

      - name: Publish release
        if: steps.changes.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk plaude-glyph.apk
          TAG="glyph-plaude-v1.${{ github.run_number }}"
          gh release create "$TAG" plaude-glyph.apk \
            --target "${{ github.sha }}" \
            --title "Plaude Glyph v1.${{ github.run_number }}" \
            --notes "APK del Glyph Toy de Plaude para el Nothing Phone (4a) Pro. Built from ${{ github.ref_name }}."
